<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg3)"/>
  
  <!-- Chess board pattern -->
  <g opacity="0.15">
    <rect x="40" y="40" width="40" height="40" fill="white"/>
    <rect x="120" y="40" width="40" height="40" fill="white"/>
    <rect x="200" y="40" width="40" height="40" fill="white"/>
    <rect x="280" y="40" width="40" height="40" fill="white"/>
    <rect x="80" y="80" width="40" height="40" fill="white"/>
    <rect x="160" y="80" width="40" height="40" fill="white"/>
    <rect x="240" y="80" width="40" height="40" fill="white"/>
    <rect x="320" y="80" width="40" height="40" fill="white"/>
  </g>
  
  <!-- Chess Knight piece -->
  <g transform="translate(200, 150)">
    <!-- Base -->
    <ellipse cx="0" cy="60" rx="45" ry="8" fill="#ffffff" opacity="0.3"/>
    <rect x="-40" y="50" width="80" height="10" rx="2" fill="#ffffff"/>
    <rect x="-35" y="40" width="70" height="12" rx="2" fill="#ffffff"/>
    
    <!-- Knight head -->
    <path d="M -15 40 L -20 20 L -25 0 L -20 -20 L -10 -35 L 0 -40 L 10 -38 L 15 -30 L 12 -20 L 15 -10 L 20 0 L 22 15 L 20 30 L 15 40 Z" fill="#ffffff"/>
    
    <!-- Eye -->
    <circle cx="5" cy="-25" r="3" fill="#6366f1"/>
    
    <!-- Ear -->
    <path d="M -8 -35 L -12 -42 L -8 -40 Z" fill="#ffffff"/>
    
    <!-- Mane -->
    <path d="M -15 -15 L -18 -10 L -15 -5 L -18 0 L -15 5" stroke="#fbbf24" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    Chess Challenge
  </text>
</svg>
