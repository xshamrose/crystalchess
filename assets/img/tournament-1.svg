<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg1)"/>
  
  <!-- Chess board pattern -->
  <g opacity="0.1">
    <rect x="50" y="50" width="40" height="40" fill="white"/>
    <rect x="130" y="50" width="40" height="40" fill="white"/>
    <rect x="210" y="50" width="40" height="40" fill="white"/>
    <rect x="290" y="50" width="40" height="40" fill="white"/>
    <rect x="90" y="90" width="40" height="40" fill="white"/>
    <rect x="170" y="90" width="40" height="40" fill="white"/>
    <rect x="250" y="90" width="40" height="40" fill="white"/>
    <rect x="330" y="90" width="40" height="40" fill="white"/>
  </g>
  
  <!-- Chess King piece -->
  <g transform="translate(200, 150)">
    <!-- Base -->
    <ellipse cx="0" cy="60" rx="45" ry="8" fill="#ffffff" opacity="0.3"/>
    <rect x="-40" y="50" width="80" height="10" rx="2" fill="#ffffff"/>
    <rect x="-35" y="40" width="70" height="12" rx="2" fill="#ffffff"/>
    
    <!-- Body -->
    <path d="M -25 40 L -20 -20 L 20 -20 L 25 40 Z" fill="#ffffff"/>
    
    <!-- Crown -->
    <rect x="-22" y="-25" width="44" height="8" rx="2" fill="#fbbf24"/>
    <path d="M -22 -25 L -15 -40 L -8 -28 L 0 -45 L 8 -28 L 15 -40 L 22 -25 Z" fill="#fbbf24"/>
    
    <!-- Cross on top -->
    <rect x="-2" y="-55" width="4" height="15" rx="1" fill="#fbbf24"/>
    <rect x="-6" y="-51" width="12" height="4" rx="1" fill="#fbbf24"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    Chess Tournament
  </text>
</svg>
