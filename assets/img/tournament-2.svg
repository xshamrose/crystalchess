<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg2)"/>
  
  <!-- Chess board pattern -->
  <g opacity="0.15">
    <rect x="60" y="60" width="35" height="35" fill="white"/>
    <rect x="130" y="60" width="35" height="35" fill="white"/>
    <rect x="200" y="60" width="35" height="35" fill="white"/>
    <rect x="270" y="60" width="35" height="35" fill="white"/>
    <rect x="95" y="95" width="35" height="35" fill="white"/>
    <rect x="165" y="95" width="35" height="35" fill="white"/>
    <rect x="235" y="95" width="35" height="35" fill="white"/>
    <rect x="305" y="95" width="35" height="35" fill="white"/>
  </g>
  
  <!-- Chess Queen piece -->
  <g transform="translate(200, 150)">
    <!-- Base -->
    <ellipse cx="0" cy="60" rx="45" ry="8" fill="#ffffff" opacity="0.3"/>
    <rect x="-40" y="50" width="80" height="10" rx="2" fill="#ffffff"/>
    <rect x="-35" y="40" width="70" height="12" rx="2" fill="#ffffff"/>
    
    <!-- Body -->
    <path d="M -25 40 L -22 0 L 22 0 L 25 40 Z" fill="#ffffff"/>
    
    <!-- Crown with spheres -->
    <circle cx="-20" cy="-5" r="6" fill="#fbbf24"/>
    <circle cx="-10" cy="-8" r="6" fill="#fbbf24"/>
    <circle cx="0" cy="-10" r="7" fill="#fbbf24"/>
    <circle cx="10" cy="-8" r="6" fill="#fbbf24"/>
    <circle cx="20" cy="-5" r="6" fill="#fbbf24"/>
    
    <!-- Crown base -->
    <rect x="-25" y="0" width="50" height="6" rx="2" fill="#fbbf24"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    Grand Prix
  </text>
</svg>
